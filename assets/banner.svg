<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a4a"/>
      <stop offset="1" stop-color="#3b2a6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- Mac mini -->
  <g transform="translate(120 110)">
    <rect width="200" height="70" rx="16" fill="#d9dce3"/>
    <rect y="62" width="200" height="8" rx="4" fill="#a9adb8"/>
    <circle cx="170" cy="35" r="5" fill="#5ee38a"/>
  </g>
  <!-- feed lines -->
  <g stroke="#8fa8ff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M60 80 q30 20 60 40"/><path d="M40 150 h80"/><path d="M60 220 q30 -20 60 -40"/>
  </g>
  <!-- phone -->
  <g transform="translate(980 70)">
    <rect width="110" height="190" rx="18" fill="#0f1424" stroke="#d9dce3" stroke-width="5"/>
    <rect x="16" y="30" width="78" height="14" rx="7" fill="#5ea8ff"/>
    <rect x="16" y="54" width="60" height="10" rx="5" fill="#8fa8ff"/>
    <rect x="16" y="72" width="70" height="10" rx="5" fill="#8fa8ff"/>
  </g>
  <path d="M345 150 h610" stroke="#5ee38a" stroke-width="4" stroke-dasharray="10 12"/>
  <g font-family="-apple-system, SF Pro Display, Helvetica, Arial, sans-serif" fill="#fff" text-anchor="middle">
    <text x="650" y="110" font-size="68" font-weight="800">digest-kit</text>
    <text x="650" y="215" font-size="26" opacity="0.9">Your Mac mini reads the internet for you.</text>
  </g>
</svg>
